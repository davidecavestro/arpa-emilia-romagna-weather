refresh_data:
  name: "Refresh Weather Data"
  description: "Manually refresh weather data from the API"
  fields:
    entry_id:
      name: "Station"
      description: "The configured station to refresh. Refreshes all of them when omitted."
      required: false
      selector:
        config_entry:
          integration: arpa_emilia_romagna_weather

archive_brightness:
  name: "Archive night sky brightness"
  description: "Import the night sky brightness readings the ARPAE API exposes as long-term statistics"
  fields:
    entry_id:
      name: "Station"
      description: "The configured station whose nearby brightness stations to archive. Archives for all of them when omitted."
      required: false
      selector:
        config_entry:
          integration: arpa_emilia_romagna_weather
